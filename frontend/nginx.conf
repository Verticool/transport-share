# Раздача собранного фронта и проксирование к бэкенду.
#
# Фронт и сервер живут на одном origin: браузер обращается к /api и /ws, nginx передаёт их
# контейнеру бэкенда. Поэтому в браузере нет ни CORS-настроек, ни адресов сервера — только
# относительные пути, и поведение в контейнере совпадает с поведением на dev-сервере.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие: статика собирается одним крупным файлом из-за карт, без gzip она едет заметно дольше.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Разрешение имён берём у Docker: адрес контейнера меняется при пересборке (`--build`),
    # и статичный `proxy_pass` с именем оставлял бы фронт с 502 до перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Запросы к API — на бэкенд, путь сохраняется как есть.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Поток событий: обычный HTTP-прокси не подходит, соединение переходит в режим websocket.
    # Долгий таймаут чтения — иначе поток закрывался бы на паузах между событиями.
    location /ws {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Одностраничное приложение: любой неизвестный путь отдаёт index.html, маршруты разбирает фронт.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики: имена файлов сборки содержат хеш, поэтому можно надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
